<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ごめんね</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #fff0f5 0%, #fff8f0 100%);
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2.5rem 1.5rem;
    width: 100%;
    max-width: 480px;
  }
  .heart-anim {
    font-size: 72px;
    margin-bottom: 1.2rem;
    display: block;
    text-align: center;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  .title {
    font-size: 26px;
    font-weight: 700;
    color: #c2185b;
    margin-bottom: 0.5rem;
    text-align: center;
  }
  .subtitle {
    font-size: 15px;
    color: #888;
    margin-bottom: 2rem;
    text-align: center;
    line-height: 1.7;
  }
  .card {
    background: white;
    border-radius: 20px;
    padding: 2rem;
    box-shadow: 0 4px 24px rgba(194, 24, 91, 0.08);
    width: 100%;
    margin-bottom: 2rem;
  }
  .message {
    font-size: 16px;
    color: #444;
    line-height: 2;
    text-align: center;
  }
  .highlight {
    color: #c2185b;
    font-weight: 700;
  }
  .btn-area { position: relative; display: inline-block; }
  .btn-main {
    background: #e91e63;
    color: white;
    border: none;
    border-radius: 50px;
    padding: 16px 48px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    transition: transform 0.15s, background 0.15s;
    box-shadow: 0 4px 20px rgba(233, 30, 99, 0.3);
    display: block;
  }
  .btn-main:hover { background: #c2185b; transform: scale(1.04); }
  .btn-main:active { transform: scale(0.97); }
  .floating {
    position: absolute;
    pointer-events: none;
    font-size: 26px;
    animation: floatUp 2.5s ease forwards;
    opacity: 0;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-200px) scale(1.5); }
  }
  #thanks {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    animation: fadeIn 0.6s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .thanks-icon { font-size: 72px; margin-bottom: 1rem; }
  .thanks-text { font-size: 22px; color: #c2185b; font-weight: 700; margin-bottom: 0.6rem; }
  .thanks-sub { font-size: 15px; color: #888; line-height: 1.8; }
</style>
</head>
<body>

<div class="wrap" id="main">
  <span class="heart-anim">💕</span>
  <div class="title">ごめんね</div>
  <p class="subtitle">伝えたいことがあるんだけど…</p>
  <div class="card">
    <p class="message">
      最近、<span class="highlight">ごめんね。</span><br><br>
      断りもなく勝手に<span class="highlight">イヤフォンを持って行って</span>しまいました。<br><br>
      使いたいときに困らせてしまったかも。<br>
      ちゃんと一言言えばよかった。反省してます。<br><br>
      これからはちゃんと声かけるね。🙏
    </p>
  </div>
  <div class="btn-area" id="btnArea">
    <button class="btn-main" onclick="handleForgive()">許してあげる 💗</button>
  </div>
</div>

<div class="wrap" id="thanks">
  <div class="thanks-icon">🥺💞</div>
  <div class="thanks-text">ありがとう、大好き！</div>
  <p class="thanks-sub">これから気をつけます。<br>本当にごめんね。</p>
</div>

<script>
function handleForgive() {
  const btn = document.querySelector('.btn-main');
  const area = document.getElementById('btnArea');
  btn.textContent = '🥺 ありがとう…';
  btn.disabled = true;
  btn.style.background = '#ad1457';

  for (let i = 0; i < 8; i++) {
    setTimeout(() => {
      const el = document.createElement('span');
      el.className = 'floating';
      el.textContent = ['💗','💕','💖','✨','🌸','💓'][Math.floor(Math.random() * 6)];
      el.style.left = (20 + Math.random() * 60) + '%';
      el.style.bottom = '10px';
      area.appendChild(el);
      setTimeout(() => el.remove(), 2600);
    }, i * 200);
  }

  setTimeout(() => {
    document.getElementById('main').style.display = 'none';
    const t = document.getElementById('thanks');
    t.style.display = 'flex';
  }, 2800);
}
</script>
</body>
</html>
